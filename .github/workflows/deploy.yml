name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run migrations
        run: bun run db:migrate
        env:
          AUTHDB_DATABASE: ${{ secrets.AUTHDB_DATABASE }}
          AUTHDB_PASSWORD: ${{ secrets.AUTHDB_PASSWORD }}
          AUTHDB_USER: ${{ secrets.AUTHDB_USER }}
          AUTHDB_WRITE: ${{ secrets.AUTHDB_WRITE }}

  notify:
    name: Notify on Failure
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [migrate]
    if: failure()
    permissions: {}
    steps:
      - name: Send failure notification
        run: |
          echo "Migration failed. Check the logs for more information."
          # Add webhook or email notification here
